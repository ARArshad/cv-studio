/* little preview drawings for the template gallery */
function miniSvg(id){
  var t = TPL[id], w=120, h=96, b='#45608a', s='#e7eaf0', l='#c9cfda', d='#9aa4b4';
  var out = '<svg class="mini" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><rect width="'+w+'" height="'+h+'" fill="#fff"/>';
  var bh = t.banner ? (id==='bold'?30:id==='executive'?26:18) : 0;
  var sw = t.side ? (id==='compact'?52:40) : 0;
  var sx = t.sideOn==='right' ? w-sw : 0;
  if(t.side) out += '<rect x="'+sx+'" y="'+(id==='bold'?bh:0)+'" width="'+sw+'" height="'+(h-(id==='bold'?bh:0))+'" fill="'+(t.brandSide?b:s)+'"/>';
  if(id==='classic'){ out += '<path d="M0,0 H'+sw+' V22 Q'+(sw/2)+',30 0,22 Z" fill="'+b+'"/><path d="M0,'+h+' V'+(h-10)+' Q'+(sw/2)+',' +(h-18)+' '+sw+','+(h-10)+' V'+h+' Z" fill="'+b+'"/>'; }
  if(id==='creative'){ out += '<rect x="'+sx+'" y="0" width="'+sw+'" height="26" fill="'+b+'"/>'; }
  if(t.banner) out += '<rect x="0" y="0" width="'+w+'" height="'+bh+'" fill="'+(t.brandBanner?b:'#fff')+'"/>';
  if(t.banner && !t.brandBanner) out += '<rect x="8" y="'+(bh-3)+'" width="'+(w-16)+'" height="2" fill="'+b+'"/>';
  /* name bar */
  var nx = t.ident==='side' ? sx+6 : 8, nw = t.ident==='side' ? sw-12 : 46;
  if(t.identAlign==='center' && t.ident!=='side') nx = (w-nw)/2;
  out += '<rect x="'+nx+'" y="'+(t.ident==='side'?8:5)+'" width="'+nw+'" height="6" fill="'+(t.brandBanner||t.brandSide?'#ffffff':b)+'"/>';
  /* body lines */
  var mx = (t.side && t.sideOn==='left') ? sw+7 : 7, mw = w - sw - 14;
  var y = bh + (t.banner?8:10);
  for(var i=0;i<6;i++){
    out += '<rect x="'+mx+'" y="'+y+'" width="'+(i%3===0?mw*0.5:mw)+'" height="'+(i%3===0?4:2.5)+'" fill="'+(i%3===0?b:l)+'"/>';
    y += i%3===0 ? 9 : 6;
    if(y > h-8) break;
  }
  /* sidebar lines */
  if(t.side){
    var yy = (id==='classic'? 40 : id==='bold'? bh+8 : 34);
    for(var j=0;j<5;j++){
      out += '<rect x="'+(sx+6)+'" y="'+yy+'" width="'+(sw-14)+'" height="2.5" fill="'+(t.brandSide?'rgba(255,255,255,.75)':d)+'"/>';
      yy += 7; if(yy>h-8) break;
    }
  }
  return out + '</svg>';
}

   7. STATE
   ===================================================================== */
var KEY = 'cv-studio-v2';
var DOC = starterDoc();
var pagesEl = $('#pages');
var focusPath = null;
var undoStack = [], redoStack = [];

function sec(id){ for(var i=0;i<DOC.sections.length;i++) if(DOC.sections[i].id===id) return DOC.sections[i]; return null; }
function secIndex(id){ for(var i=0;i<DOC.sections.length;i++) if(DOC.sections[i].id===id) return i; return -1; }

/* read and write a value by the short paths used in data-p */
function setVal(path, value){
  var a = path.split('.');
  if(a[0]==='p'){ DOC.profile[a[1]] = value; return; }
  if(a[0]==='d'){ DOC.profile.details[+a[1]].text = value; return; }
  if(a[0]==='s'){
    var s = sec(a[1]); if(!s) return;
    if(a[2]==='title'){ s.title = value; return; }
    if(a[2]==='body'){ s.body = value; return; }
    if(a[2]==='items'){
      var i = +a[3];
      if(a.length===4){ s.items[i] = value; return; }              /* bullets list */
      if(a[4]==='pts'){ s.items[i].pts[+a[5]] = value; return; }   /* entry bullet */
      s.items[i][a[4]] = value; return;                            /* title, sub, date, name */
    }
  }
}

/* =====================================================================
   8. RENDERING
   ===================================================================== */
function ed(path, cls, ph, rich, val){
  return '<'+(rich?'div':'span')+' class="'+cls+'" contenteditable data-p="'+path+'"'
       + (rich?' data-rich="1"':'') + ' data-ph="'+esc(ph)+'">' + (val==null?'':val) + '</'+(rich?'div':'span')+'>';
}
var X_LEFT  = '<button class="ui xbtn left" data-act="%A%" %D% title="Remove">&times;</button>';
var X_RIGHT = '<button class="ui xbtn right" data-act="%A%" %D% title="Remove">&times;</button>';
function xbtn(tpl, act, data){ return tpl.replace('%A%', act).replace('%D%', data); }
function addBtn(act, data, label, where){
  return '<button class="ui addbtn '+(where||'bl')+'" data-act="'+act+'" '+data+'>'+label+'</button>';
}

function identityHtml(where){
  var T = TPL[DOC.design.template], P = DOC.profile, d = DOC.design;
  var onBrand = (where==='banner' && T.brandBanner) || (where==='side' && (T.brandSide || DOC.design.template==='classic'));
  var photo = '';
  if(d.showPhoto && P.photo){
    photo = '<div class="photo-wrap'+(T.brandSide?' plain':'')+'">'
          + '<img id="photoImg" src="'+P.photo+'" alt="">'
          + '<div class="photo-edit ui"><span>Drag to move, click to change</span></div></div>';
  }
  var who = '<div class="ident '+(T.identAlign==='left'?'left':'')+(onBrand?' on-brand':'')+'">'
          + ed('p.name','nm','Your name',false,P.name)
          + ed('p.role','role','Job title you are going for',false,P.role)
          + '</div>';
  return { photo:photo, who:who, onBrand:onBrand };
}

function detailsHtml(row){
  var out = '<div class="details'+(row?' row':'')+' hov">';
  DOC.profile.details.forEach(function(d,i){
    out += '<div class="detail">'
        +  '<span class="ic" data-act="icon" data-i="'+i+'">'+iconSvg(d.icon)+'</span>'
        +  ed('d.'+i+'.text','','Detail',false,d.text)
        +  xbtn(X_LEFT,'del-detail','data-i="'+i+'"')
        +  '</div>';
  });
  out += addBtn('add-detail','','+ Add detail','bl');
  return out + '</div>';
}

function levelMarks(sid, i, level, style){
  if(style==='bars') return '<div class="bar"><i style="right:'+(100-level*20)+'%"></i></div>';
  if(style==='plain' || !level) return '';
  var out = '<span class="dots">';
  for(var k=1;k<=5;k++) out += '<button class="dot'+(k<=level?' on':'')+'" data-act="level" data-sid="'+sid+'" data-i="'+i+'" data-l="'+k+'"></button>';
  return out + '</span>';
}

/* one section becomes one or more blocks so it can break across pages */
function sectionBlocks(s){
  var d = DOC.design, out = [], head = '<div class="h-sec">'+ed('s.'+s.id+'.title','','Section title',false,s.title)+'</div>';
  var tools = '<button class="ui xbtn right" data-act="del-sec" data-sid="'+s.id+'" title="Remove section">&times;</button>';

  function wrap(html, last){ return '<div class="blk'+(last?'':' tight')+'" data-sid="'+s.id+'">'+html+'</div>'; }

  if(s.type==='text'){
    out.push(wrap(tools+head+ed('s.'+s.id+'.body','body-text','Write a short profile',true,s.body), true));
    return out;
  }

  if(s.type==='entries'){
    var items = s.items.length ? s.items : [{title:'',sub:'',date:'',pts:['']}];
    items.forEach(function(it,i){
      var dateHtml = d.dateStyle==='hidden' ? '' : ed('s.'+s.id+'.items.'+i+'.date','ed','Dates',false,it.date);
      var titleRow = d.dateStyle==='right'
        ? '<div class="head-row">'+ed('s.'+s.id+'.items.'+i+'.title','et','Job title',false,it.title)+dateHtml+'</div>'
        : ed('s.'+s.id+'.items.'+i+'.title','et','Job title',false,it.title);
      var subRow = ed('s.'+s.id+'.items.'+i+'.sub','es','Company and place',false,it.sub)
                 + (d.dateStyle==='under' ? '<div>'+dateHtml+'</div>' : '');
      var pts = '<ul class="pts hov">';
      (it.pts||[]).forEach(function(p,j){
        pts += '<li>'+ed('s.'+s.id+'.items.'+i+'.pts.'+j,'','What you did',false,p)
            +  xbtn(X_RIGHT,'del-pt','data-sid="'+s.id+'" data-i="'+i+'" data-j="'+j+'"')+'</li>';
      });
      pts += addBtn('add-pt','data-sid="'+s.id+'" data-i="'+i+'"','+ Add bullet','bl') + '</ul>';
      var entry = '<div class="entry">'
                + xbtn(X_RIGHT,'del-entry','data-sid="'+s.id+'" data-i="'+i+'"')
                + titleRow + subRow + pts + '</div>';
      var last = (i === items.length-1);
      var body = (i===0 ? tools+head : '') + entry
               + (last ? addBtn('add-entry','data-sid="'+s.id+'"','+ Add entry','br') : '');
      out.push('<div class="blk'+(last?'':' tight')+' hov" data-sid="'+s.id+'">'+body+'</div>');
    });
    return out;
  }

  if(s.type==='bullets'){
    var lis = '<ul class="pts hov">';
    (s.items.length?s.items:['']).forEach(function(p,i){
      lis += '<li>'+ed('s.'+s.id+'.items.'+i,'','Line',false,p)
          +  xbtn(X_RIGHT,'del-row','data-sid="'+s.id+'" data-i="'+i+'"')+'</li>';
    });
    lis += addBtn('add-row','data-sid="'+s.id+'"','+ Add line','bl') + '</ul>';
    out.push(wrap(tools+head+lis, true));
    return out;
  }

  /* skills and languages */
  var style = (s.type==='languages') ? (d.skillStyle==='tags'?'dots':d.skillStyle) : d.skillStyle;
  var body;
  if(style==='tags'){
    body = '<div class="tags hov">';
    s.items.forEach(function(it,i){
      body += '<span class="tag rowitem">'+ed('s.'+s.id+'.items.'+i+'.name','','Skill',false,it.name)
           +  xbtn(X_RIGHT,'del-row','data-sid="'+s.id+'" data-i="'+i+'"')+'</span>';
    });
    body += addBtn('add-row','data-sid="'+s.id+'"','+ Add','bl')+'</div>';
  }else{
    body = '<div class="rowlist hov">';
    s.items.forEach(function(it,i){
      var marks = levelMarks(s.id, i, it.level|0, style);
      body += '<div class="rowitem">'
           +  '<div class="rl">'+ed('s.'+s.id+'.items.'+i+'.name','','Name',false,it.name)
           +  (style==='bars'?'':marks)+'</div>'
           +  (style==='bars'?marks:'')
           +  xbtn(X_LEFT,'del-row','data-sid="'+s.id+'" data-i="'+i+'"')
           +  '</div>';
    });
    body += addBtn('add-row','data-sid="'+s.id+'"','+ Add','bl')+'</div>';
  }
  out.push(wrap(tools+head+body, true));
  return out;
}

function newPage(index){
  var T = TPL[DOC.design.template], d = DOC.design;
  var struct = T.side ? 'sidebar' : (T.banner ? 'header' : 'single');
  var p = el('<div class="page" data-tpl="'+d.template+'" data-side="'+(T.sideOn||'left')+'" data-struct="'+struct+'" data-noicons="'+(d.icons==='1'?0:1)+'">'
    + '<svg class="art" viewBox="0 0 100 1000" preserveAspectRatio="none" aria-hidden="true"></svg>'
    + '<div class="sheet">'
    + '<div class="cols">'
    + (T.side ? '<aside class="col side"></aside>' : '')
    + '<main class="col main"></main>'
    + '</div></div></div>');
  pagesEl.appendChild(p);
  return p;
}

function bannerHtml(){
  var T = TPL[DOC.design.template];
  if(!T.banner) return '';
  var id = identityHtml('banner');
  var det = detailsHtml(T.detailsRow);
  var who = '<div class="who">'+id.who+(T.details==='banner'?det:'')+'</div>';
  var inner = T.photoFirst ? id.photo+who : who+id.photo;
  return '<header class="banner'+(T.brandBanner?' on-brand':'')+'">'+inner+'</header>';
}

function render(){
  normalise();
  var T = TPL[DOC.design.template], d = DOC.design;
  pagesEl.innerHTML = '';
  var page = newPage(0);

  /* banner */
  if(T.banner){
    var sheet = page.querySelector('.sheet');
    sheet.insertBefore(el(bannerHtml()), sheet.firstChild);
  }

  var sideCol = page.querySelector('.col.side'), mainCol = page.querySelector('.col.main');

  /* identity and details when they live in the sidebar */
  if(!T.banner){
    var idt = identityHtml('side');
    var host = sideCol || mainCol;
    var identBlk = '<div class="blk ident-blk">' + (T.photoFirst ? idt.photo+idt.who : idt.who+idt.photo) + '</div>';
    host.insertAdjacentHTML('beforeend', identBlk);
    host.insertAdjacentHTML('beforeend', '<div class="blk">'+detailsHtml(false)+'</div>');
  }

  /* sections */
  DOC.sections.forEach(function(s){
    if(s.show===false) return;
    var host = (T.side && s.col==='side') ? sideCol : mainCol;
    if(!host) host = mainCol;
    sectionBlocks(s).forEach(function(h){ host.insertAdjacentHTML('beforeend', h); });
  });

  /* add section button lives at the end of the main column */
  mainCol.insertAdjacentHTML('beforeend',
    '<div class="blk" style="margin-top:6px"><button class="ui addbtn bl" data-act="add-sec" style="position:relative;opacity:1;left:0;bottom:0">+ Add section</button></div>');

  applyDesign();
  paginate();
  syncArt();
  if(focusPath){ focusByPath(focusPath); focusPath = null; }
  updatePageFlag();
}

/* make sure the document always has the shape the renderer expects */
function normalise(){
  var P = DOC.profile;
  P.details = P.details || [];
  DOC.sections.forEach(function(s){
    if(s.type === 'text'){ if(typeof s.body !== 'string') s.body = ''; return; }
    if(!Array.isArray(s.items)) s.items = [];
    if(s.type === 'entries'){
      if(!s.items.length) s.items.push({title:'',sub:'',date:'',pts:['']});
      s.items.forEach(function(it){ if(!Array.isArray(it.pts) || !it.pts.length) it.pts = ['']; });
    }else if(s.type === 'bullets'){
      if(!s.items.length) s.items.push('');
    }else{
      if(!s.items.length) s.items.push({name:'', level:(s.type==='languages'?3:0)});
    }
  });
}

/* pull everything back onto page one, then let it overflow again */
function reflow(){
  var pages = $$('.page', pagesEl);
  if(!pages.length) return;
  ['side','main'].forEach(function(name){
    var target = pages[0].querySelector('.col.'+name);
    if(!target) return;
    for(var i=1;i<pages.length;i++){
      var c = pages[i].querySelector('.col.'+name);
      if(!c) continue;
      while(c.firstElementChild) target.appendChild(c.firstElementChild);
    }
  });
  for(var j=pages.length-1;j>0;j--) pages[j].remove();
  /* put any carried over bullets back with the job they came from */
  $$('.blk[data-cont]', pages[0]).forEach(function(c){
    var prev = c.previousElementSibling, ul = prev && prev.querySelector('ul.pts');
    if(ul){
      var addb = ul.querySelector('.addbtn');
      $$(':scope > li', c.querySelector('ul.pts')).forEach(function(li){
        addb ? ul.insertBefore(li, addb) : ul.appendChild(li);
      });
    }
    c.remove();
  });
  paginate();
}

/* when one job is too tall for what is left, carry its last bullets over
   rather than pushing the whole job to the next page and leaving a gap */
function carryBullets(col, i, name, blk){
  var ul = blk.querySelector('ul.pts');
  if(!ul) return false;
  var lis = $$(':scope > li', ul);
  if(lis.length <= 1) return false;
  var next = pagesEl.children[i+1] || newPage(i+1);
  var target = next.querySelector('.col.'+name) || next.querySelector('.col.main');
  var sid = blk.getAttribute('data-sid') || '';
  var cont = target.firstElementChild;
  if(!cont || cont.getAttribute('data-cont') !== sid){
    cont = el('<div class="blk tight" data-cont="'+sid+'"><ul class="pts"></ul></div>');
    target.insertBefore(cont, target.firstChild);
  }
  var cul = cont.querySelector('ul.pts');
  cul.insertBefore(lis[lis.length-1], cul.firstChild);
  return true;
}

/* move overflowing blocks onto the next page until everything fits */
function paginate(){
  var guard = 0;
  for(var i=0;i<pagesEl.children.length && guard<500;i++){
    var pg = pagesEl.children[i];
    ['side','main'].forEach(function(name){
      var col = pg.querySelector('.col.'+name);
      if(!col) return;
      while(col.scrollHeight > col.clientHeight + 1 && col.children.length > 0 && guard++ < 500){
        var last = col.lastElementChild;
        /* how much room is left once this block is taken out of the column */
        var free = col.clientHeight - (col.scrollHeight - last.offsetHeight);
        if(col.children.length === 1 || free > 110){
          if(carryBullets(col, i, name, last)) continue;
          if(col.children.length === 1) break;
        }
        var next = pagesEl.children[i+1] || newPage(i+1);
        var target = next.querySelector('.col.'+name) || next.querySelector('.col.main');
        /* if some of its bullets were carried over already, take them back first */
        var c = target.firstElementChild;
        if(c && c.getAttribute('data-cont') && c.getAttribute('data-cont') === last.getAttribute('data-sid')){
          var ul = last.querySelector('ul.pts'), addb = ul && ul.querySelector('.addbtn');
          if(ul) $$(':scope > li', c.querySelector('ul.pts')).forEach(function(li){ addb ? ul.insertBefore(li, addb) : ul.appendChild(li); });
          c.remove();
        }
        target.insertBefore(last, target.firstChild);
      }
    });
  }
  /* remove pages that ended up empty */
  for(var j=pagesEl.children.length-1;j>0;j--){
    var p = pagesEl.children[j], used = false;
    $$('.col', p).forEach(function(c){ if(c.children.length) used = true; });
    if(!used) p.remove();
  }
  /* artwork for every page */
  syncArt();
}

/* the artwork follows the sidebar width and the real banner height */
function syncArt(){
  var T = TPL[DOC.design.template];
  var first = pagesEl.querySelector('.page');
  if(!first) return;
  var sw = parseFloat(getComputedStyle(first).getPropertyValue('--side-w')) || 33.4;
  $$('.page', pagesEl).forEach(function(p, idx){
    var banner = p.querySelector('.banner');
    var bh = banner ? (banner.offsetHeight / 1122.5 * 1000) : 0;
    p.querySelector('.art').innerHTML = T.art(sw, idx, bh);
  });
}

function applyDesign(){
  var d = DOC.design;
  var css = SCHEMES[d.scheme] ? SCHEMES[d.scheme].c : SCHEMES[0].c;
  $$('.page', pagesEl).forEach(function(p){
    Object.keys(css).forEach(function(k){ p.style.setProperty(k, css[k]); });
    Object.keys(d.vars).forEach(function(k){ p.style.setProperty(k, d.vars[k]); });
    p.style.setProperty('--photo-radius', d.photoShape);
  });
}
